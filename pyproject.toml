[project]
name = "media-article-writer"
version = "0.1.0"
description = "CLI tool for generating human-like media articles using AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "exa-py>=1.0.0",
    "google-api-python-client>=2.100.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "crewai>=0.80.0",
    "crewai-tools>=0.15.0",
    "google-genai>=1.57.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "responses>=0.23.0",
    "freezegun>=1.2.0",
]

[project.scripts]
article-writer = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
only-include = ["src"]

[tool.uv]
# Security floors for transitive dependencies (Dependabot advisories).
constraint-dependencies = [
    "pillow>=13.0.0",
    "virtualenv>=21.14.9",
    "multidict>=6.9.1,<7",
    "soupsieve>=2.9.0,<3",
    "protobuf>=5.29.6,<6",
    "pyarrow>=23.0.1,<24",
    "filelock>=4.2.1",
]
